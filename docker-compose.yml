name: keyremap-11

services:
  app:
    build: .
    ports:
      - "10921:8000"
    volumes:
      - ./data:/app/data
    environment:
      # 正确性口径部署级单选：complete（甲/分段齐套）或 degrade（乙/主段降级）。
      # 首次建库时写入库内，之后不一致会拒绝启动；同一库不得混用两种写法。
      - KEYREMAP_SRC_PART_ARCH=${KEYREMAP_SRC_PART_ARCH:-complete}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
